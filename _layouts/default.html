<!DOCTYPE html>
<html lang="{{ site.lang | default: 'de' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }} — {{ site.description }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>

<body>
    {% include header.html %}
    {% include nav.html %}

    <main class="container">
        {{ content }}
    </main>

    {% include footer.html %}
    <script src="{{ '/js/main.js' | relative_url }}"></script>
</body>

</html>
